<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabrina Ghosh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #16261c;
    --moss: #3d5c3f;
    --sage: #9ab894;
    --parchment: #f6f1e7;
    --ink: #17241a;
    --brass: #c19a52;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--forest);
    color: var(--parchment);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    text-align: center;
  }

  .portrait {
    width: 168px;
    height: 168px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 22%;
    border: 1px solid rgba(193,154,82,0.4);
    box-shadow: 0 0 0 8px rgba(193,154,82,0.08);
    margin: 0 auto 28px;
    display: block;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 500;
    font-size: 32px;
    letter-spacing: 0.01em;
    color: var(--parchment);
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 48px;
  }

  .tabs {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .tab {
    appearance: none;
    border: 1px solid rgba(246,241,231,0.22);
    background: transparent;
    color: var(--parchment);
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 14px 26px;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-block;
  }

  .tab:hover, .tab.active {
    border-color: var(--brass);
    color: var(--brass);
  }

  /* GATE PANEL */
  .gate {
    margin-top: 32px;
    padding: 32px 28px;
    background: rgba(246,241,231,0.04);
    border: 1px solid rgba(246,241,231,0.14);
    display: none;
  }

  .gate.open { display: block; }

  .gate-label {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 6px;
  }

  .gate-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--parchment);
    margin-bottom: 20px;
  }

  .gate form {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .gate input {
    font-family: 'Jost', sans-serif;
    font-size: 14px;
    font-weight: 300;
    color: var(--ink);
    background: var(--parchment);
    border: 1px solid transparent;
    padding: 12px 16px;
    outline: none;
    flex: 1;
    min-width: 160px;
  }

  .gate button {
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--brass);
    border: none;
    padding: 12px 22px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .gate button:hover { background: var(--sage); }

  .gate-msg {
    margin-top: 16px;
    font-size: 13px;
    font-weight: 300;
    color: rgba(246,241,231,0.55);
    min-height: 18px;
  }

  .gate-msg.error { color: #d69a9a; }

  @media (max-width: 480px) {
    .portrait { width: 140px; height: 140px; }
    h1 { font-size: 26px; }
  }
</style>
</head>

  <h1>Sabrina Ghosh</h1>
  <div class="subtitle">Gates Cambridge Scholar &middot; Neuroscience</div>

  <div class="tabs">
    <button type="button" class="tab" data-tab="personal">Personal</button>
    <button type="button" class="tab" data-tab="professional">Professional</button>
    <a href="/tutoring/" class="tab">Tutoring</a>
  </div>

  <div class="gate" id="gate-personal">
    <div class="gate-label">Private</div>
    <div class="gate-title">Personal</div>
    <form onsubmit="return checkPassword(event, 'gate-personal')">
      <input type="password" placeholder="Password" autocomplete="off">
      <button type="submit">Enter</button>
    </form>
    <div class="gate-msg"></div>
  </div>

  <div class="gate" id="gate-professional">
    <div class="gate-label">Private</div>
    <div class="gate-title">Professional</div>
    <form onsubmit="return checkPassword(event, 'gate-professional')">
      <input type="password" placeholder="Password" autocomplete="off">
      <button type="submit">Enter</button>
    </form>
    <div class="gate-msg"></div>
  </div>
</div>

<script>
  var tabs = document.querySelectorAll('.tab[data-tab]');
  tabs.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var key = btn.getAttribute('data-tab');
      var target = document.getElementById('gate-' + key);
      var isOpen = target.classList.contains('open');
      document.querySelectorAll('.gate').forEach(function (g) { g.classList.remove('open'); });
      tabs.forEach(function (t) { t.classList.remove('active'); });
      if (!isOpen) {
        target.classList.add('open');
        btn.classList.add('active');
      }
    });
  });

  function checkPassword(e, gateId) {
    e.preventDefault();
    var gate = document.getElementById(gateId);
    var msg = gate.querySelector('.gate-msg');
    msg.textContent = 'Incorrect password. This section is currently private — please check back soon.';
    msg.classList.add('error');
    return false;
  }
</script>
